{{- if and .Values.featureGates.enableClusterInfrastructure .Values.clusterCore.networkPolicy.enabled }}
# Restricts who can scrape :{{ .Values.clusterCore.metricsPort }} /metrics and
# limits cluster-core egress. Health (:{{ .Values.clusterCore.healthCheck.port }})
# and webhook (:{{ .Values.clusterCore.webhook.port }}) stay open to-source because
# kubelet and the API server come from node/control-plane IPs that are
# install-specific. Pin those with clusterCore.networkPolicy.extraIngress if you
# know the CIDRs.
#
# Enforcement needs a CNI that honors NetworkPolicy (Calico/Cilium/EKS).
# k3d/flannel often does not; the object still applies for production CNIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubevela.fullname" . }}-cluster-core
  namespace: {{ .Release.Namespace }}
  labels:
    controller.oam.dev/name: vela-cluster-core
    {{- include "kubevela.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      controller.oam.dev/name: vela-cluster-core
      {{- include "kubevela.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.clusterCore.healthCheck.port }}
    - ports:
        - protocol: TCP
          port: {{ .Values.clusterCore.webhook.port }}
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{- toYaml .Values.clusterCore.networkPolicy.metricsScraperLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.clusterCore.metricsPort }}
    {{- with .Values.clusterCore.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # EKS Pod Identity hands the controller its base AWS identity over plain HTTP on a
    # link-local address, so the 443 rule above does not cover it. Without this rule every
    # aws-arm spoke fails at Materialize with a connection refused buried in an SDK retry
    # chain, which reads as a credential problem rather than a network policy one.
    #
    # IRSA needs nothing extra: it exchanges a projected token with STS over 443. An EC2
    # instance profile would need 169.254.169.254 adding here, which is why it is called
    # out rather than assumed.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - podSelector:
            matchLabels:
              {{- include "kubevela-cluster-gateway.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.multicluster.clusterGateway.port }}
    {{- with .Values.clusterCore.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
