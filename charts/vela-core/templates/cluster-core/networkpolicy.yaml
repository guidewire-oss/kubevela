{{- if and .Values.featureGates.enableClusterInfrastructure .Values.clusterCore.networkPolicy.enabled }}
# Restricts who can scrape :{{ .Values.clusterCore.metricsPort }} /metrics and
# limits cluster-core egress. Health (:{{ .Values.clusterCore.healthCheck.port }})
# and webhook (:9445) stay open to-source because kubelet and the API server
# come from node/control-plane IPs that are install-specific. Pin those with
# clusterCore.networkPolicy.extraIngress if you know the CIDRs.
#
# Enforcement needs a CNI that honors NetworkPolicy (Calico/Cilium/EKS).
# k3d/flannel often does not; the object still applies for production CNIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubevela.fullname" . }}-cluster-core
  namespace: {{ .Release.Namespace }}
  labels:
    controller.oam.dev/name: vela-cluster-core
    {{- include "kubevela.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      controller.oam.dev/name: vela-cluster-core
      {{- include "kubevela.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.clusterCore.healthCheck.port }}
    - ports:
        - protocol: TCP
          port: 9445
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{- toYaml .Values.clusterCore.networkPolicy.metricsScraperLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.clusterCore.metricsPort }}
    {{- with .Values.clusterCore.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vela-core-cluster-gateway
              app.kubernetes.io/instance: vela-core-cluster-gateway
      ports:
        - protocol: TCP
          port: 9443
    {{- with .Values.clusterCore.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
