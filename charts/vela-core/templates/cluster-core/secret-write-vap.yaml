{{- if and .Values.featureGates.enableClusterInfrastructure .Values.rbac.create }}
{{- $sa := printf "%s-cluster-core" (include "kubevela.fullname" .) -}}
{{- $username := printf "system:serviceaccount:%s:%s" .Release.Namespace $sa -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kubevela.fullname" . }}-cluster-core-secret-write
  labels:
    {{- include "kubevela.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
        scope: Namespaced
  matchConditions:
    - name: cluster-core-service-account
      expression: request.userInfo.username == {{ $username | quote }}
  variables:
    - name: secret
      expression: "object != null ? object : oldObject"
  validations:
    - expression: |
        has(variables.secret.metadata.labels) &&
        variables.secret.metadata.labels['cluster.core.oam.dev/cluster-credential-type'] != ''
      message: >-
        {{ $sa }} may only create, update, or delete Secrets labeled
        cluster.core.oam.dev/cluster-credential-type (gateway credentials)
    - expression: |
        variables.secret.metadata.name != {{ printf "%s-admission" (include "kubevela.fullname" .) | quote }} &&
        variables.secret.metadata.name != {{ printf "%s-cluster-core-admission" (include "kubevela.fullname" .) | quote }} &&
        variables.secret.metadata.name != {{ printf "%s-cluster-gateway-tls-v2" (include "kubevela.fullname" .) | quote }}
      message: >-
        {{ $sa }} must not mutate webhook or cluster-gateway TLS Secrets
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kubevela.fullname" . }}-cluster-core-secret-write
  labels:
    {{- include "kubevela.labels" . | nindent 4 }}
spec:
  policyName: {{ include "kubevela.fullname" . }}-cluster-core-secret-write
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
{{- end }}
