{{- if .Values.featureGates.enableClusterInfrastructure }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubevela.fullname" . }}-cluster-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevela.labels" . | nindent 4 }}
  {{- with .Values.clusterCore }}
  {{- with .aws }}
  {{- with .serviceAccountRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubevela.fullname" . }}:cluster-core
  labels:
    {{- include "kubevela.labels" . | nindent 4 }}
rules:
  # SpokeCluster reconcile: get plus informer list/watch, update for finalizer add/remove.
  - apiGroups: ["core.oam.dev"]
    resources: ["spokeclusters"]
    verbs: ["get", "list", "watch", "update"]
  # Status is written through Status().Update with conflict retry (never patched).
  - apiGroups: ["core.oam.dev"]
    resources: ["spokeclusters/status"]
    verbs: ["update"]
  # OwnerReferencesPermissionEnforcement checks the controller ownerRef (blockOwnerDeletion)
  # on the gateway Secret against this subresource.
  - apiGroups: ["core.oam.dev"]
    resources: ["spokeclusters/finalizers"]
    verbs: ["update"]
  # Direct Get of a same-namespace or allowlisted kubeconfig Secret (source credential).
  # list/watch stay off the ClusterRole so the manager never starts a
  # cluster-wide Secret informer; gateway-ns informer verbs live on the Role
  # below, and source Gets use the uncached API reader.
  # ID-01: when clusterCore.kubeconfigSecretNamespaces is non-empty, omit this
  # cluster-wide get and grant secrets get only via Roles in those namespaces
  # (plus the release namespace). Empty (default) keeps cluster-wide get so
  # tenant-ns SpokeClusters keep working without listing every namespace.
  {{- if not .Values.clusterCore.kubeconfigSecretNamespaces }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  # multicluster.Initialize reads the cluster-gateway APIService by name to discover the
  # gateway service and Secret namespace.
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    resourceNames: ["v1alpha1.cluster.core.oam.dev"]
    verbs: ["get"]
  # Spoke probe (/healthz) and discovery (/version, node info) are GETs routed through the
  # cluster-gateway proxy subresource.
  - apiGroups: ["cluster.core.oam.dev"]
    resources: ["clustergateways/proxy"]
    verbs: ["get"]
  # DetachCluster lists all ResourceTrackers and updates those referencing the detached cluster.
  # get and watch are required because the manager's cached client starts an informer on the
  # first List; without them the reflector retries forever with Forbidden remapped to unknown.
  - apiGroups: ["core.oam.dev"]
    resources: ["resourcetrackers"]
    verbs: ["get", "list", "watch", "update"]
  # Event recorder wired in SetupWithManager; SpokeCluster events land in any namespace.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubevela.fullname" . }}:cluster-core-rolebinding
  labels:
    {{- include "kubevela.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubevela.fullname" . }}:cluster-core
subjects:
  - kind: ServiceAccount
    name: {{ include "kubevela.fullname" . }}-cluster-core
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubevela.fullname" . }}:cluster-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevela.labels" . | nindent 4 }}
rules:
  # Gateway Secret informer (get/list/watch) plus upsert/delete on register/detach and
  # the optional legacy-secret upgrade pass. Confined to the release namespace. The
  # controller is started with --cluster-gateway-secret-namespace set to that same
  # namespace so a failed cluster-gateway Initialize cannot point the informer at
  # vela-system while this Role lives elsewhere.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader election: LeaderElectionID vela-cluster-core, default lease lock, pod namespace.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubevela.fullname" . }}:cluster-core-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevela.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubevela.fullname" . }}:cluster-core
subjects:
  - kind: ServiceAccount
    name: {{ include "kubevela.fullname" . }}-cluster-core
    namespace: {{ .Release.Namespace }}
{{- /* ID-01: namespace-scoped source Secret gets when allowlist is set.
     The release namespace already has secrets get via the Role above. */}}
{{- if .Values.clusterCore.kubeconfigSecretNamespaces }}
{{- $seen := dict }}
{{- range .Values.clusterCore.kubeconfigSecretNamespaces }}
{{- if and (ne . $.Release.Namespace) (not (hasKey $seen .)) }}
{{- $_ := set $seen . true }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubevela.fullname" $ }}:cluster-core-kubeconfig-read
  namespace: {{ . }}
  labels:
    {{- include "kubevela.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubevela.fullname" $ }}:cluster-core-kubeconfig-read
  namespace: {{ . }}
  labels:
    {{- include "kubevela.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubevela.fullname" $ }}:cluster-core-kubeconfig-read
subjects:
  - kind: ServiceAccount
    name: {{ include "kubevela.fullname" $ }}-cluster-core
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
