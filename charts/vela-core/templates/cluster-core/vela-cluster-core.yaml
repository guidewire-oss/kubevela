{{- if .Values.featureGates.enableClusterInfrastructure }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubevela.fullname" . }}-cluster-core
  namespace: {{ .Release.Namespace }}
  labels:
    controller.oam.dev/name: vela-cluster-core
    {{- include "kubevela.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.clusterCore.replicaCount }}
  selector:
    matchLabels:
      controller.oam.dev/name: vela-cluster-core
      {{- include "kubevela.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        controller.oam.dev/name: vela-cluster-core
        {{- include "kubevela.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "{{ .Values.clusterCore.metricsPort }}"
        prometheus.io/scrape: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubevela.clusterCoreServiceAccountName" . }}
      securityContext:
      {{- if .Values.clusterCore.podSecurityContext }}
      {{- toYaml .Values.clusterCore.podSecurityContext | nindent 8 }}
      {{- else }}
      {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: cluster-core
          securityContext:
          {{- if .Values.clusterCore.securityContext }}
          {{- toYaml .Values.clusterCore.securityContext | nindent 12 }}
          {{- else }}
          {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ .Values.imageRegistry }}{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ quote .Values.image.pullPolicy }}
          command: ["cluster-manager"]
          args:
            - "--metrics-bind-address=:{{ .Values.clusterCore.metricsPort }}"
            - "--health-probe-bind-address=:{{ .Values.clusterCore.healthCheck.port }}"
            - "--enable-leader-election"
            - "--concurrent-reconciles={{ .Values.clusterCore.concurrentReconciles }}"
            - "--credential-cache-ttl={{ include "kubevela.clusterCore.credentialCacheTTLSeconds" . }}s"
            - "--cluster-gateway-secret-namespace={{ .Release.Namespace }}"
            {{- if .Values.clusterCore.spokeEndpoint.denyPrivate }}
            - "--spoke-endpoint-deny-private=true"
            {{- end }}
            - "--feature-gates=EnableClusterInfrastructure=true"
            {{- if .Values.clusterCore.webhook.enabled }}
            - "--use-webhook=true"
            - "--webhook-port={{ .Values.clusterCore.webhook.port }}"
            - "--webhook-cert-dir={{ .Values.admissionWebhooks.certificate.mountPath }}"
            {{- end }}
          ports:
            - containerPort: {{ .Values.clusterCore.healthCheck.port }}
              name: healthz
              protocol: TCP
            - containerPort: {{ .Values.clusterCore.metricsPort }}
              name: metrics
              protocol: TCP
            {{- if .Values.clusterCore.webhook.enabled }}
            - containerPort: {{ .Values.clusterCore.webhook.port }}
              name: webhook-server
              protocol: TCP
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 90
            periodSeconds: 5
          resources:
          {{- toYaml .Values.clusterCore.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            {{- if .Values.clusterCore.webhook.enabled }}
            - mountPath: {{ .Values.admissionWebhooks.certificate.mountPath }}
              name: tls-cert-vol
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.clusterCore.webhook.enabled }}
        - name: tls-cert-vol
          secret:
            defaultMode: 420
            secretName: {{ template "kubevela.fullname" . }}-cluster-core-admission
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
      {{- if .Values.clusterCore.affinity }}
        {{- toYaml .Values.clusterCore.affinity | nindent 8 }}
      {{- else if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if gt (int .Values.clusterCore.replicaCount) 1 }}
        podAntiAffinity:
          # Hard anti-affinity when HA replicas are enabled so both webhook/controller
          # pods cannot land on one node. Single-node installs (for example k3d) must
          # set clusterCore.replicaCount=1 (see values comments).
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  controller.oam.dev/name: vela-cluster-core
                  {{- include "kubevela.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    controller.oam.dev/name: vela-cluster-core
                    {{- include "kubevela.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- if kindIs "slice" .Values.clusterCore.topologySpreadConstraints }}
      {{- if gt (len .Values.clusterCore.topologySpreadConstraints) 0 }}
      topologySpreadConstraints:
        {{- toYaml .Values.clusterCore.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      {{- else if gt (int .Values.clusterCore.replicaCount) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              controller.oam.dev/name: vela-cluster-core
              {{- include "kubevela.selectorLabels" . | nindent 14 }}
        # Soft zone spread: multi-AZ hubs spread when zones exist; single-AZ hubs
        # still schedule (ScheduleAnyway). Override via clusterCore.topologySpreadConstraints.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              controller.oam.dev/name: vela-cluster-core
              {{- include "kubevela.selectorLabels" . | nindent 14 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              controller.oam.dev/name: vela-cluster-core
              {{- include "kubevela.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
