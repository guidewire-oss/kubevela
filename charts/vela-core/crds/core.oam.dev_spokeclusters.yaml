---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: spokeclusters.core.oam.dev
spec:
  group: core.oam.dev
  names:
    categories:
    - oam
    kind: SpokeCluster
    listKind: SpokeClusterList
    plural: spokeclusters
    shortNames:
    - spc
    singular: spokecluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: MODE
      type: string
    - jsonPath: .status.clusterInfo.kubernetesVersion
      name: VERSION
      type: string
    - jsonPath: .status.clusterInfo.nodeCount
      name: NODES
      type: integer
    - jsonPath: .status.clusterInfo.platform
      name: PLATFORM
      type: string
    - jsonPath: .status.connection
      name: STATUS
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    - jsonPath: .status.clusterInfo.region
      name: REGION
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.apiServerEndpoint
      name: ENDPOINT
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.totalCPU
      name: CPU
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.totalMemory
      name: MEMORY
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.latencyMillis
      name: LATENCY
      priority: 1
      type: integer
    - jsonPath: .status.clusterInfo.lastSyncedTime
      name: SYNCED
      priority: 1
      type: date
    - jsonPath: .spec.credential.type
      name: AUTH
      priority: 1
      type: string
    - jsonPath: .status.lastProbeTime
      name: LAST PROBE
      priority: 1
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          SpokeCluster is the first-class hub representation of one managed cluster. A
          cluster acting as a hub for downstream clusters can hold SpokeCluster
          objects at any level of the tree.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SpokeClusterSpec is the desired state of a managed cluster
              on the hub.
            properties:
              blueprintRef:
                description: |-
                  BlueprintRef references the ClusterBlueprint revision to dispatch to the
                  cluster.

                  Phase 2 stub: accepted by admission and ignored. No Phase 1 controller
                  dispatches it.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  revision:
                    description: Revision pins an immutable revision of the referenced
                      object.
                    type: string
                required:
                - name
                type: object
              credential:
                description: |-
                  Credential is the hub-to-spoke connectivity credential, a discriminated
                  union keyed by type.
                properties:
                  aws:
                    description: AWS holds AWS cloud-native identity configuration.
                    properties:
                      authMode:
                        description: |-
                          AuthMode records how the hub pod's ambient AWS identity was
                          wired (podIdentity or irsa). Both values use the same
                          LoadDefaultConfig chain; Materialize refuses a clear ambient
                          mismatch.
                        enum:
                        - podIdentity
                        - irsa
                        type: string
                      clusterName:
                        description: ClusterName is the EKS cluster name.
                        type: string
                      externalId:
                        description: |-
                          ExternalID is the STS external id for the role assumption.
                          Required with roleArn so the trust policy can demand the same
                          value (confused-deputy mitigation). Admission rejects AWS
                          spokes that omit it.
                        type: string
                      region:
                        description: Region is the AWS region the cluster runs in.
                        type: string
                      roleArn:
                        description: RoleARN is the per-cluster IAM role the hub assumes.
                        type: string
                    required:
                    - authMode
                    - clusterName
                    - externalId
                    - region
                    - roleArn
                    type: object
                  azure:
                    description: Azure holds Azure cloud-native identity configuration.
                    properties:
                      authMode:
                        description: AuthMode is the Azure authentication mode.
                        enum:
                        - workloadIdentity
                        - managedIdentity
                        type: string
                      clientID:
                        description: ClientID is the workload or managed identity
                          the hub authenticates as.
                        type: string
                      clusterName:
                        description: ClusterName is the AKS cluster name.
                        type: string
                      resourceGroup:
                        description: ResourceGroup is the resource group the AKS cluster
                          lives in.
                        type: string
                      subscriptionID:
                        description: SubscriptionID is the Azure subscription that
                          owns the AKS cluster.
                        type: string
                      tenantID:
                        description: TenantID is the Entra tenant the federated identity
                          belongs to.
                        type: string
                    required:
                    - authMode
                    - clusterName
                    - resourceGroup
                    - subscriptionID
                    type: object
                  gcp:
                    description: GCP holds GCP cloud-native identity configuration.
                    properties:
                      authMode:
                        description: AuthMode is the GCP authentication mode.
                        enum:
                        - workloadIdentityFederation
                        - serviceAccount
                        type: string
                      clusterName:
                        description: ClusterName is the GKE cluster name.
                        type: string
                      location:
                        description: Location is the cluster's region or zone.
                        type: string
                      projectID:
                        description: ProjectID is the GCP project that owns the GKE
                          cluster.
                        type: string
                      serviceAccountEmail:
                        description: ServiceAccountEmail is the Google service account
                          the hub impersonates.
                        type: string
                    required:
                    - authMode
                    - clusterName
                    - location
                    - projectID
                    type: object
                  kubeconfig:
                    description: Kubeconfig holds a reference to a kubeconfig Secret.
                    properties:
                      secretRef:
                        description: SecretRef points at the Secret holding the kubeconfig.
                        properties:
                          key:
                            description: Key is the data key within the Secret. Defaults
                              to "kubeconfig".
                            type: string
                          name:
                            description: Name is the Secret name.
                            type: string
                          namespace:
                            description: |-
                              Namespace is the Secret namespace. If set, it must match the
                              SpokeCluster namespace. The admission webhook rejects any other
                              value. Omit it to use the SpokeCluster's namespace.
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  type:
                    description: Type selects the credential arm.
                    enum:
                    - kubeconfig
                    - aws
                    - azure
                    - gcp
                    type: string
                required:
                - type
                type: object
              deletionPolicy:
                default: detach
                description: DeletionPolicy controls the fate of the hub-side registration
                  on delete.
                enum:
                - detach
                - orphan
                type: string
              infraProvisioning:
                description: |-
                  InfraProvisioning references the shared cloud infrastructure the hub
                  reconciles against cloud APIs before the cluster is dispatched to (VPC,
                  IAM, DNS, and cluster creation when mode is provision).

                  Phase 2 stub: defined so the schema is forward-compatible. No Phase 1
                  controller reconciles it. The admission webhook rejects it in connect mode.
                properties:
                  blueprintRef:
                    description: |-
                      BlueprintRef references the ClusterBlueprint that describes the shared
                      infrastructure to reconcile on the hub.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      revision:
                        description: Revision pins an immutable revision of the referenced
                          object.
                        type: string
                    required:
                    - name
                    type: object
                type: object
              mode:
                default: connect
                description: Mode is the cluster lifecycle mode. Defaults to connect
                  when unset.
                enum:
                - connect
                - provision
                - adopt
                type: string
              probeIntervalSeconds:
                default: 30
                description: ProbeIntervalSeconds is how often the hub probes the
                  spoke for reachability.
                format: int32
                maximum: 600
                minimum: 10
                type: integer
              probeTimeoutSeconds:
                default: 10
                description: ProbeTimeoutSeconds is the per-probe timeout.
                format: int32
                maximum: 120
                minimum: 1
                type: integer
              rolloutStrategyRef:
                description: |-
                  RolloutStrategyRef references the ClusterRolloutStrategy that gates when a
                  new blueprint revision is dispatched to the cluster.

                  Phase 2 stub: accepted by admission and ignored. No Phase 1 controller
                  reads it.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  revision:
                    description: Revision pins an immutable revision of the referenced
                      object.
                    type: string
                required:
                - name
                type: object
            required:
            - credential
            type: object
          status:
            description: SpokeClusterStatus is the observed state of a managed cluster.
            properties:
              clusterInfo:
                description: ClusterInfo is the discovered inventory of the spoke.
                properties:
                  apiServerEndpoint:
                    description: APIServerEndpoint is the spoke API server endpoint.
                    type: string
                  kubernetesVersion:
                    description: KubernetesVersion is the spoke API server version.
                    type: string
                  lastSyncedTime:
                    description: |-
                      LastSyncedTime is when this inventory was last discovered successfully.

                      It advances only on a successful discovery, so it does not move while the spoke is
                      unreachable (discovery is skipped) or while discovery is failing. That is what makes
                      it the field to read for staleness: the InfoSynced condition's lastTransitionTime
                      records when discovery first started succeeding, not when it last did.
                      status.lastProbeTime is refreshed on a coarser cadence.
                    format: date-time
                    type: string
                  latencyMillis:
                    description: LatencyMillis is the last observed hub-to-spoke round-trip
                      latency.
                    format: int64
                    type: integer
                  nodeCount:
                    description: NodeCount is the number of nodes in the spoke.
                    type: integer
                  platform:
                    description: Platform is the discovered cluster flavour (eks,
                      gke, aks, kind, k3s).
                    type: string
                  region:
                    description: Region is the cloud region the spoke runs in.
                    type: string
                  totalCPU:
                    description: TotalCPU is the aggregate allocatable CPU across
                      nodes.
                    type: string
                  totalMemory:
                    description: TotalMemory is the aggregate allocatable memory across
                      nodes.
                    type: string
                type: object
              conditions:
                description: Conditions is the list of standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connection:
                description: Connection is the observed connectivity state.
                enum:
                - Connected
                - Disconnected
                - Unknown
                type: string
              dispatchedRevision:
                description: |-
                  DispatchedRevision is the blueprint revision the hub last dispatched to the
                  spoke. The dispatch controller advances a spoke when this differs from
                  spec.blueprintRef.revision.

                  Phase 2 stub: written by the dispatch controller once blueprint dispatch is
                  built; empty in connect-only Phase 1.
                type: string
              health:
                description: |-
                  Health is the spoke's blueprint health, pulled from the spoke Cluster on
                  demand while connected. The spoke never pushes it to the hub.

                  Phase 2 stub: populated once blueprint dispatch and spoke-side health
                  aggregation exist; nil in connect-only Phase 1.
                properties:
                  lastPulledAt:
                    description: LastPulledAt is when the hub last pulled health from
                      the spoke.
                    format: date-time
                    type: string
                  planesHealthy:
                    description: PlanesHealthy is the number of blueprint planes reporting
                      healthy.
                    type: integer
                  planesTotal:
                    description: PlanesTotal is the total number of blueprint planes
                      on the spoke.
                    type: integer
                  status:
                    description: |-
                      Status is the aggregate blueprint health of the spoke (for example Healthy
                      or Degraded).
                    type: string
                type: object
              lastProbeTime:
                description: |-
                  LastProbeTime is when the hub last wrote a probe observation into status.
                  Healthy passes refresh it at most every five minutes so the LAST PROBE
                  column stays recent without an etcd write on every probe interval.
                  Probe failures (Connected=False, ProbeFailed) update it on every
                  observed probe. Pre-probe failures (credential or register) flip
                  connection via markConnectionUnobserved without advancing
                  LastProbeTime.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: name must not be the reserved local cluster name
          rule: self.metadata.name != 'local'
        - message: mode must be 'connect' in Phase 1 (provision and adopt are not supported
            yet)
          rule: self.spec.mode == 'connect'
        - message: credential.type must be kubeconfig or aws in Phase 1
          rule: self.spec.credential.type in ['kubeconfig', 'aws']
    served: true
    storage: true
    subresources:
      status: {}
