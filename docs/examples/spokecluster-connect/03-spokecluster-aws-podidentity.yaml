# EKS spoke via Pod Identity. NO Secret is created for this.
#
# What happens per materialization:
#   1. Load the hub pod's ambient identity (Pod Identity association on the
#      vela-cluster-core service account). This identity holds no spoke access itself.
#   2. sts:AssumeRole into roleArn below, with externalId as the confused-deputy guard.
#   3. eks:DescribeCluster to resolve the spoke endpoint and CA.
#   4. Mint a k8s-aws-v1. bearer token (15-minute STS window, X-Amz-Expires=900).
#      Refresh deadline NextRefresh = now+13 minutes; requeue is capped by that.
#
# externalId is generated by EKS in the form:
#   <region>/<hubAccount>/<hubCluster>/<namespace>/<serviceAccount>
#
# The service-account segment MUST match the SA the pod actually runs as, which is always
# "<release>-cluster-core" (for example "vela-core-cluster-core"). Setting
# clusterCore.aws.serviceAccountRoleArn only annotates that account for IRSA; it does not
# change which account the pod uses. Getting this segment wrong is the most common cause of
# AssumeRole being denied.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: prod-east
  namespace: vela-system
  labels:
    provider: aws
    region: us-west-2
spec:
  mode: connect
  credential:
    type: aws
    aws:
      authMode: podIdentity
      clusterName: prod-east
      region: us-west-2
      # Per-cluster scoped role in the SPOKE's account, trusted by the hub base role.
      # Cross-account works through this same assume. Admission requires each AWS
      # SpokeCluster to use a distinct roleArn (do not share one role across spokes).
      roleArn: arn:aws:iam::111122223333:role/spokecluster-prod-east
      externalId: us-west-2/111122223333/hub-cluster/vela-system/vela-core-cluster-core
  probeIntervalSeconds: 30
  deletionPolicy: detach
---
# Prerequisites on the AWS side, for reference:
#
#   Spoke cluster authenticationMode must be API or API_AND_CONFIG_MAP, and the
#   scoped role needs an access entry:
#
#     aws eks create-access-entry --cluster-name <spoke> --principal-arn <scopedRoleArn>
#     aws eks associate-access-policy --cluster-name <spoke> --principal-arn <scopedRoleArn> \
#       --access-scope type=cluster \
#       --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
#
#   AmazonEKSViewPolicy is narrower, but check it grants `nodes` before relying on it:
#   discovery lists nodes and storage classes, and currently fails wholesale if either
#   is denied.
