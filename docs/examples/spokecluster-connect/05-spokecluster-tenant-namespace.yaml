# A detach SpokeCluster declared OUTSIDE vela-system.
#
# This case failed on every reconcile until 7e0263de1. The gateway Secret always
# lives in vela-system, Kubernetes forbids cross-namespace owner references, and
# SetControllerReference returned an error rather than skipping, so a tenant-namespace
# detach spoke never connected while the same object with orphan connected fine.
#
# Now the owner reference is skipped when the namespaces differ, and the finalizer
# carries cleanup on its own. The controller also stamps
# spokecluster.core.oam.dev/owner and spokecluster.core.oam.dev/deletion-policy on
# the gateway Secret so the gateway-secret janitor can reclaim it if the
# SpokeCluster is FORCE-deleted (finalizer patched off) while deletionPolicy is
# detach. An ordinary `kubectl delete` still cleans up via the finalizer.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: tenant-spoke
  namespace: team-a
spec:
  mode: connect
  credential:
    type: kubeconfig
    kubeconfig:
      secretRef:
        # Resolves to team-a/spoke-kubeconfig.
        name: spoke-kubeconfig
  deletionPolicy: detach
  probeIntervalSeconds: 10
---
# Expected result:
#
#   kubectl get spokecluster tenant-spoke -n team-a
#   NAME           MODE      VERSION        NODES  PLATFORM  STATUS      AGE
#   tenant-spoke   connect   v1.31.5+k3s1   1      k3s       Connected   10s
#
#   kubectl get secret tenant-spoke -n vela-system -o jsonpath='{.metadata.ownerReferences}'
#   (empty, by design)
#
#   kubectl get secret tenant-spoke -n vela-system \
#     -o jsonpath='{.metadata.annotations.spokecluster\.core\.oam\.dev/owner}'
#   team-a/tenant-spoke
#
#   kubectl get secret tenant-spoke -n vela-system \
#     -o jsonpath='{.metadata.annotations.spokecluster\.core\.oam\.dev/deletion-policy}'
#   detach
