# REFERENCE ONLY. Do not apply this.
#
# This is what the controller WRITES for you, in vela-system, named after the
# SpokeCluster. It is the output of registration, not an input.
#
# Creating it by hand is exactly the legacy `vela cluster join` path the SpokeCluster
# CRD exists to replace. Worse, a Secret with no owner annotation is treated as foreign:
# registration will refuse to adopt it, and a SpokeCluster of the same name will sit
# there failing rather than taking it over.
#
# It is reproduced here so you can recognise a correct one when debugging.

apiVersion: v1
kind: Secret
metadata:
  # Always the SpokeCluster's name, with no namespace component. Two SpokeClusters
  # sharing a name across different namespaces therefore collide on one Secret;
  # the second is refused.
  name: tenant-spoke
  # Always the resolved gateway namespace, regardless of where the SpokeCluster lives.
  namespace: vela-system
  labels:
    # cluster-gateway keys on this to recognise the Secret as a cluster.
    # Values: ServiceAccountToken, X509Certificate.
    cluster.core.oam.dev/cluster-credential-type: ServiceAccountToken
  annotations:
    # Written by this controller. Records which SpokeCluster (namespace/name) owns it.
    # This is what distinguishes "a Secret we manage" from "a manually joined cluster",
    # and it cannot be replaced by the owner reference, because orphan deliberately
    # clears that reference. Join/rename refuse overwrite when this key is set.
    spokecluster.core.oam.dev/owner: team-a/tenant-spoke
    # Written by this controller. The gateway-secret janitor uses it after a
    # force-deleted SpokeCluster (no finalizer) to decide detach vs orphan.
    spokecluster.core.oam.dev/deletion-policy: detach
  # Present only when the SpokeCluster is in vela-system AND deletionPolicy is detach.
  # Absent for a tenant-namespace spoke (owner references cannot cross namespaces)
  # and absent under orphan. The finalizer is the ordinary cleanup path; ownerRef is
  # only a same-namespace garbage-collection backstop.
  #
  # ownerReferences:
  #   - apiVersion: core.oam.dev/v1beta1
  #     kind: SpokeCluster
  #     name: gateway-ns-spoke
  #     uid: 68fcaf46-b21d-4416-9729-10d4a66db9c4
  #     controller: true
  #     blockOwnerDeletion: true
type: Opaque
data:
  # Always present.
  endpoint: aHR0cHM6Ly9zcG9rZS5leGFtcGxlLmNvbTo2NDQz

  # Always present for connect. Materialize and register refuse empty CAData;
  # cluster-gateway would treat a missing ca.crt as insecure skip-verify, which
  # Phase 1 does not allow.
  ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLgotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0tCg==

  # Exactly one of these two shapes, never both. The whole data map is replaced on
  # every write, which is what drops the stale arm when a credential flips kind.
  #
  #   token                       -> ServiceAccountToken
  #   tls.crt + tls.key           -> X509Certificate
  token: cmVwbGFjZS1tZS10b2tlbg==
  # tls.crt: ...
  # tls.key: ...

  # Present only when the source kubeconfig set proxy-url. Same key `vela cluster
  # join` writes. Omitted for a direct dial (including every AWS materialize).
  # proxy-url: aHR0cDovLzEwLjAuMC4xOjgwODA=

# Note there is NO server-name key. cluster-gateway always derives the verified TLS
# ServerName from the endpoint host, which is why a kubeconfig tls-server-name that
# differs from that host is rejected at registration rather than silently dropped.
