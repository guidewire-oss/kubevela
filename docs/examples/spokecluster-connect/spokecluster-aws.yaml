# SpokeCluster connecting to an EKS cluster via AWS Pod Identity.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: prod-us-east-1
  namespace: vela-system
  labels:
    provider: aws
    region: us-east-1
spec:
  mode: connect
  credential:
    type: aws
    aws:
      authMode: podIdentity        # podIdentity | irsa
      clusterName: prod-us-east-1
      region: us-east-1
      roleArn: arn:aws:iam::123456789012:role/per-cluster-role
      # Required: must match the Condition sts:ExternalId on the role trust policy.
      externalId: us-east-1/123456789012/hub-cluster/vela-system/vela-core-cluster-core
