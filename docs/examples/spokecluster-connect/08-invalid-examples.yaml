# Cases that SHOULD be rejected. Useful as an admission regression check.
# Each is annotated with where the rejection comes from and what you should see.
#
# Cases marked CEL are enforced by the CRD's x-kubernetes-validations, so they are
# refused by the API server itself and hold on a default install, where the chart
# ships clusterCore.webhook.enabled=false. Cases marked webhook need it enabled.
#
# Apply with: kubectl apply -f 08-invalid-examples.yaml
# Expect every one to fail. Any that succeeds is a bug.

---
# 1. mode: provision is not supported in this release. CEL, and the webhook as well.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: invalid-mode-provision
  namespace: vela-system
spec:
  mode: provision
  credential:
    type: kubeconfig
    kubeconfig:
      secretRef:
        name: spoke-kubeconfig

---
# 2. Credential arm does not match type. The union is strict: every arm not named by
#    `type` is forbidden, not merely ignored. CEL, and the webhook as well.
#    The aws arm here is deliberately complete: leave a required field out and
#    structural validation fails first, so the union rule never gets evaluated and
#    the case stops proving what it claims to.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: invalid-arm-mismatch
  namespace: vela-system
spec:
  credential:
    type: kubeconfig
    aws:
      authMode: podIdentity
      clusterName: whatever
      region: us-west-2
      roleArn: arn:aws:iam::111122223333:role/x
      externalId: external-x

---
# 3. Both arms present. Same rule, other direction. CEL, and the webhook as well.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: invalid-two-arms
  namespace: vela-system
spec:
  credential:
    type: aws
    aws:
      authMode: irsa
      clusterName: c
      region: us-west-2
      roleArn: arn:aws:iam::111122223333:role/x
      externalId: external-x
    kubeconfig:
      secretRef:
        name: spoke-kubeconfig

---
# 4. Missing secretRef.name.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: invalid-no-secret-name
  namespace: vela-system
spec:
  credential:
    type: kubeconfig
    kubeconfig:
      secretRef:
        key: kubeconfig

---
# 5. Unknown authMode. Only podIdentity and irsa are accepted.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: invalid-authmode
  namespace: vela-system
spec:
  credential:
    type: aws
    aws:
      authMode: accessKey
      clusterName: c
      region: us-west-2
      roleArn: arn:aws:iam::111122223333:role/x

---
# 6. infraProvisioning in connect mode. Provisioning belongs to mode: provision.
#    CEL, and the webhook as well.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: invalid-infra-in-connect
  namespace: vela-system
spec:
  mode: connect
  credential:
    type: kubeconfig
    kubeconfig:
      secretRef:
        name: spoke-kubeconfig
  infraProvisioning:
    blueprintRef:
      name: eks-standard

---
# 7. Cross-namespace kubeconfig secretRef. Rejected by the webhook (and again by
#    the provider if admission is bypassed). Empty secretRef.namespace is fine;
#    it falls back to the SpokeCluster's own namespace.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: invalid-cross-ns-secret
  namespace: tenant-a
spec:
  mode: connect
  credential:
    type: kubeconfig
    kubeconfig:
      secretRef:
        name: privileged-spoke-kubeconfig
        namespace: platform-secrets

---
# 8. Registered stubs. azure/gcp stay on the CRD enum for forward compatibility
#    but are rejected by the webhook (unsupported type). With the webhook off they
#    are ACCEPTED by admission and then fail at materialization with a clear
#    not-implemented error.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: stub-azure
  namespace: vela-system
spec:
  credential:
    type: azure
    azure:
      authMode: workloadIdentity
      subscriptionID: 00000000-0000-0000-0000-000000000000
      resourceGroup: rg-platform
      clusterName: aks-prod

---
# 9. Same stub rule for gcp.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: stub-gcp
  namespace: vela-system
spec:
  credential:
    type: gcp
    gcp:
      authMode: workloadIdentityFederation
      projectID: my-gcp-project
      location: us-central1
      clusterName: gke-prod

---
# 10. Runtime rejections, not admission ones. These pass the webhook and fail during
#    registration, which is the point: they are properties of the credential, not the spec.
#
#    a. kubeconfig with a file-path certificate-authority
#         -> "uses a file-path certificate-authority; only inline
#            certificate-authority-data is supported for connect"
#
#    b. kubeconfig whose tls-server-name differs from the endpoint host
#         -> "credential requires TLS server name X, but cluster-gateway always
#            verifies against the endpoint host Y"
#
#    c. kubeconfig with an exec plugin (aws eks get-token, gke-gcloud-auth-plugin)
#         -> "has no embedded token or client cert/key; exec and file-path
#            credentials are not supported for connect"
#
#    d. a SpokeCluster whose name collides with a gateway Secret written by
#       `vela cluster join` (no owner annotation)
#         -> "already exists and is not managed by a SpokeCluster (likely a
#            manually joined cluster); refusing to overwrite it"
#
#    e. kubeconfig whose server is http://..., or https://169.254.169.254/...,
#       or https://kubernetes.default.svc (hub SSRF). Rejected at materialize/
#       register with "spoke endpoint ... is not permitted" / "must use https".
#       RFC1918 k3d IPs and *.eks.amazonaws.com remain allowed.
#
#    f. kubeconfig with insecure-skip-tls-verify: true (even with CA data present)
#         -> "sets insecure-skip-tls-verify; connect requires TLS verification
#            with inline certificate-authority-data"
#
#    g. kubeconfig with no certificate-authority-data
#         -> "has no certificate-authority-data; connect requires an inline CA
#            bundle so cluster-gateway can verify the spoke API server"
#
#    h. two SpokeClusters with the same name in different namespaces
#         -> the second gets "is owned by a different SpokeCluster (ns/name);
#            refusing to overwrite it"
#
#    i. kubeconfig whose proxy-url is http://169.254.169.254/, or
#       http://127.0.0.1:8080, or http://kubernetes.default.svc
#         -> "spoke proxy-url ... is not permitted". http and RFC1918
#            (for example http://10.0.0.1:8080) remain allowed.
