apiVersion: core.oam.dev/v1beta1
kind: SourceDefinition
metadata:
  name: vela-addon
  namespace: vela-system
  annotations:
    definition.oam.dev/description: "Whether a KubeVela addon is installed and running, and the name and namespace of the Application it built - chain into vela-app for the detail."
    definition.oam.dev/cache-key-rules: "bb2aa884"
    definition.oam.dev/cache-key-rules-version: v1
spec:
  schematic:
    cue:
      template: |
        import "vela/kube"

        // Generated from the context this template reads - do not edit. Admission re-derives these and rejects a mismatch.
        $internal: {
        	key: "vela-addon"
        	keyInputs: []
        }

        // Whether a KubeVela addon is installed, and where its Application is.
        //
        // An addon is a construct for building an Application - so once you have that
        // Application, `vela-app` and `vela-component` already answer everything about
        // it. This source deliberately stops at the handover: it says whether the addon
        // is there and names the Application, and the existing sources take it from
        // there.
        //
        //	sources:
        //	  - name: flux
        //	    type: vela-addon
        //	    properties: {name: fluxcd}
        //	  - name: fluxApp
        //	    type: vela-app
        //	    properties:
        //	      name:      '$(source.flux.app)'
        //	      namespace: '$(source.flux.namespace)'
        //
        // `namespace` is returned for exactly that chain and is not decoration. Addon
        // Applications live in vela-system, while `vela-app` defaults its namespace to
        // the *consuming* Application's own - so a chain that passed only `app` would
        // look right and read the wrong namespace.
        //
        // A missing addon resolves to `installed: false` rather than erroring, which is
        // the opposite call to vela-component's missing component. The difference is
        // that "not installed" is a legitimate state to observe and act on, where a
        // misnamed component is a mistake in the consuming Application. Acting on it
        // does not need conditionals in the expression - which do not exist - because
        // the bool can be fed to a definition whose own template branches on it.
        schema: {
        	installed: bool
        	// The addon's Application is in phase `running`. False when not installed.
        	running: bool
        	// Name of the Application the addon built; "" when not installed.
        	app: string
        	// Where that Application lives - pass this to vela-app alongside `app`.
        	namespace: string
        }

        storage: {
        	// Status convention, as vela-app and vela-component: short, and never
        	// stale. `running` is health, and health that is quietly out of date reads
        	// as an answer.
        	storageTTL:     "1m"
        	onStaleFailure: "fail"
        }

        parameter: {
        	// +usage=Name of the addon, as `vela addon list` reports it
        	name: string
        }

        _addonNamespace: "vela-system"

        // An enabled addon is an Application labelled with its name and version. There
        // is one per addon, so the list is a lookup rather than a survey.
        _apps: kube.#List & {
        	$params: {
        		resource: {
        			apiVersion: "core.oam.dev/v1beta1"
        			kind:       "Application"
        		}
        		filter: {
        			namespace: _addonNamespace
        			matchingLabels: "addons.oam.dev/name": parameter.name
        		}
        	}
        }

        _items: *_apps.$returns.items | []
        _found: len(_items) > 0

        output: {
        	installed: _found
        	running: [
        		if _found if (*_items[0].status.status | "") == "running" {true},
        		false,
        	][0]
        	app: [
        		if _found {_items[0].metadata.name},
        		"",
        	][0]
        	namespace: _addonNamespace
        }
