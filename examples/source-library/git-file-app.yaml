apiVersion: core.oam.dev/v1beta1
kind: Application
metadata: {name: ref-demo, namespace: refsrc}
spec:
  sources:
    # Same registry for all three - only the ref differs.
    - name: dflt
      type: git-file
      properties: {registry: catalog, path: velaux/metadata.yaml}
    - name: onMaster
      type: git-file
      properties: {registry: catalog, path: velaux/metadata.yaml, ref: master}
    - name: onBranch
      type: git-file
      properties: {registry: catalog, path: velaux/metadata.yaml, ref: fix_clusters}
  components:
    - name: probe
      type: webservice
      properties:
        image: nginx:1.25.0
        port: 80
        env:
          - name: DEFAULT_REF
            value: '$(source.dflt.content.version & string)'
          - name: MASTER
            value: '$(source.onMaster.content.version & string)'
          - name: BRANCH
            value: '$(source.onBranch.content.version & string)'
