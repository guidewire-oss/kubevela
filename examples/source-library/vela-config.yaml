apiVersion: core.oam.dev/v1beta1
kind: SourceDefinition
metadata:
  name: vela-config
  namespace: vela-system
  annotations:
    definition.oam.dev/description: "Reads a KubeVela Config: its properties, the ConfigTemplate it satisfies, and references to the Secret and named objects that template produced. Output values are never returned, only their references. A Config marked sensitive is refused."
    definition.oam.dev/cache-key-rules: "6ac674fa"
    definition.oam.dev/cache-key-rules-version: v1
spec:
  schematic:
    cue:
      template: |
        import "vela/velaconfig"

        // Generated from the context this template reads - do not edit. Admission re-derives these and rejects a mismatch.
        $internal: {
        	key: "vela-config"
        	keyInputs: []
        }

        // A Config: the properties it was created with, the template it satisfies, and
        // references to whatever that template produced.
        //
        // The shape mirrors a ConfigTemplate's: `output` is the Secret the template
        // renders for the Config itself, `outputs` are the extra objects it declares,
        // under the names the template gave them.
        //
        // `properties: _` because a Config's shape is set by whichever ConfigTemplate
        // created it, which this source has no way to know. A platform wanting a typed
        // contract over a particular Config should write a definition that names its
        // fields - the read is one line, as below.
        //
        // `output` and `outputs` are references and never contents - deliberately, and
        // permanently. A Config's outputs are routinely Secrets, so a source that
        // returned their values would turn "read a setting" into "read any credential in
        // a Config nobody happened to mark sensitive", and every value would then be
        // copied into this source's own cache entry, where it outlives the render and is
        // shared by every consumer with the same key.
        //
        // A reference is enough for the thing you actually want. Wiring by name keeps
        // the value out of the Application, out of the rendered workload and out of the
        // cache, and lets Kubernetes resolve it at pod start:
        //
        //	env:
        //	  - name: API_TOKEN
        //	    valueFrom:
        //	      secretKeyRef:
        //	        name: '$(*source.cfg.outputs.creds.name | "missing-creds")'
        //	        key: token
        //
        // Anything needing the value itself should reach it by a mechanism built for
        // that - a mounted Secret, a CSI driver - not through a workload's properties.
        schema: {
        	// The properties a Config was created with are the *inputs* its template
        	// took, which for a credential-bearing template are the credential: the
        	// shipped image-registry template declares `sensitive: false` and takes
        	// auth.password among its parameters. Marking the whole struct is the only
        	// option available, since `_` declares no fields to mark individually.
        	// +sensitive
        	properties: _
        	template: {
        		name:       string
        		namespace?: string
        	}
        	// Written out twice rather than shared through a `#ref` definition: the
        	// schema block is lifted out of the template on its own to validate a
        	// source's output, so a sibling definition is not in scope there and
        	// resolves to "reference #ref not found".
        	output: {
        		apiVersion: string
        		kind:       string
        		name:       string
        		namespace?: string
        	}
        	outputs: [string]: {
        		apiVersion: string
        		kind:       string
        		name:       string
        		namespace?: string
        	}
        }

        storage: {
        	// Configs change when an operator changes them, which is rare, and the read
        	// is a single in-cluster GET.
        	storageTTL:     "5m"
        	onStaleFailure: "use-stale"
        }

        parameter: {
        	// +usage=Name of the Config
        	name: string
        	// +usage=Namespace it lives in. Defaults to vela-system.
        	namespace?: string
        }

        _cfg: velaconfig.#Read & {
        	$params: {
        		name: parameter.name
        		if parameter.namespace != _|_ {
        			namespace: parameter.namespace
        		}
        	}
        }

        output: {
        	properties: _cfg.$returns.properties
        	template:   _cfg.$returns.template
        	output:     _cfg.$returns.output
        	outputs:    _cfg.$returns.outputs
        }
