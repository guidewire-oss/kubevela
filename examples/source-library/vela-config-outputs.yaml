apiVersion: core.oam.dev/v1beta1
kind: SourceDefinition
metadata:
  name: vela-config-outputs
  namespace: vela-system
  annotations:
    definition.oam.dev/description: "Fetches the objects a KubeVela Config's template produced - its output Secret and its named outputs. These are frequently credentials; install and grant deliberately."
    definition.oam.dev/cache-key-rules: "7fdfcad2"
    definition.oam.dev/cache-key-rules-version: v1
spec:
  schematic:
    cue:
      template: |
        import (
        	"vela/kube"
        	"vela/velaconfig"
        )

        // Generated from the context this template reads - do not edit. Admission re-derives these and rejects a mismatch.
        $internal: {
        	key: "vela-config-outputs"
        	keyInputs: []
        }

        // The objects a Config's template produced, fetched.
        //
        // `vela-config` returns references; this ranges over them and reads each one.
        // The split is deliberate rather than tidiness: a Config's outputs are
        // routinely Secrets - a registry credential, a database password - so this
        // definition can hand a workload's properties the rendered credentials of any
        // Config not explicitly marked sensitive. That is a materially broader
        // capability than reading settings, and it is the same reasoning that stopped
        // us shipping a generic `secret` source.
        //
        // Keeping it separate is what makes the concern actionable: a platform can
        // install `vela-config` and not this, or install this with a `consumableFrom`
        // naming the few namespaces allowed to use it. Neither is possible if the
        // capability rides along inside the settings source.
        //
        // The shape follows a ConfigTemplate's own. `output` is the Secret the template
        // renders for the Config itself; `outputs` are the extra objects it declares,
        // under the names the template gave them:
        //
        //	outputs: {
        //	    creds: {apiVersion: "v1", kind: "Secret", ...}
        //	    settings: {apiVersion: "v1", kind: "ConfigMap", ...}
        //	}
        //
        // so a consumer writes
        //
        //	'$(source.cfg.outputs.settings.data.region & string)'
        //	'$(source.cfg.output.data.token & string)'
        //
        // Naming rather than position is not a preference: pkg/config builds the stored
        // reference list by ranging a Go map, so its order is arbitrary and can change
        // when the Config is updated. An index would silently start meaning a different
        // object. Secret values arrive base64-encoded, as Kubernetes stores them; decode
        // at the point of use.
        schema: {
        	output: _
        	outputs: [string]: _
        }

        storage: {
        	// Shorter than vela-config's: this reads live objects, which a controller
        	// or an operator can change without the Config itself being touched.
        	storageTTL:     "2m"
        	onStaleFailure: "use-stale"
        }

        parameter: {
        	// +usage=Name of the Config
        	name: string
        	// +usage=Namespace it lives in. Defaults to vela-system.
        	namespace?: string
        }

        _cfg: velaconfig.#Read & {
        	$params: {
        		name: parameter.name
        		if parameter.namespace != _|_ {
        			namespace: parameter.namespace
        		}
        	}
        }

        #fetch: {
        	ref: {
        		apiVersion: string
        		kind:       string
        		name:       string
        		namespace?: string
        	}
        	got: kube.#Get & {
        		$params: resource: {
        			apiVersion: ref.apiVersion
        			kind:       ref.kind
        			metadata: {
        				name: ref.name
        				if ref.namespace != _|_ {
        					namespace: ref.namespace
        				}
        			}
        		}
        	}
        }

        // One kube.#Get per reference. A provider call inside a comprehension over
        // another provider's output resolves in the same pass, so this needs no staging.
        _output: #fetch & {ref: _cfg.$returns.output}

        _outputs: {
        	for name, ref in _cfg.$returns.outputs {
        		"\(name)": #fetch & {"ref": ref}
        	}
        }

        output: {
        	output: _output.got.$returns
        	outputs: {
        		for name, fetched in _outputs {
        			"\(name)": fetched.got.$returns
        		}
        	}
        }
