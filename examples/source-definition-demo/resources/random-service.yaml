# A tiny HTTP service that returns a random integer in a range as JSON.
# GET /?min=<int>&max=<int>  ->  {"value": N}   (min<=N<=max; defaults 1..100)
#
# Runs python:3-alpine with the handler mounted from the ConfigMap below. No
# custom image to build. Deployed into the source-demo namespace; the
# get-random SourceDefinition polls it via the Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: random-service-script
  namespace: source-demo
data:
  server.py: |
    import json, random
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse, parse_qs

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            q = parse_qs(urlparse(self.path).query)
            try:
                lo = int(q.get("min", ["1"])[0])
                hi = int(q.get("max", ["100"])[0])
            except ValueError:
                self.send_error(400, "min/max must be integers")
                return
            if lo > hi:
                lo, hi = hi, lo
            body = json.dumps({"value": random.randint(lo, hi), "min": lo, "max": hi})
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body.encode())

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-service
  namespace: source-demo
  labels:
    app: random-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: random-service
  template:
    metadata:
      labels:
        app: random-service
    spec:
      containers:
        - name: server
          image: python:3-alpine
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /?min=1&max=1
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
      volumes:
        - name: script
          configMap:
            name: random-service-script
---
apiVersion: v1
kind: Service
metadata:
  name: random-service
  namespace: source-demo
spec:
  selector:
    app: random-service
  ports:
    - port: 80
      targetPort: 8080
