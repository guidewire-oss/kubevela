# Demonstrates two SourceDefinitions that read real cluster state, wired into an
# Application that writes the resolved values into a ConfigMap component.
#
#   1. namespace-metadata : reads the `tenant` and `department` labels off the
#                           Application's own namespace.
#   2. cluster-info       : reads the `cluster-info` ConfigMap in the `default`
#                           namespace and exposes two of its data keys.
#
# Both use the CueX `kube` provider (kube.#Get) to read from the cluster at
# resolution time. Results are cached (see storage:) and substituted into the
# component's properties via `fromSource` before the component template runs.
#
# Prerequisites (see README): the namespace must carry the labels, and the
# cluster-info ConfigMap must exist in `default`.
---
apiVersion: core.oam.dev/v1beta1
kind: SourceDefinition
metadata:
  name: namespace-metadata
  namespace: source-demo
spec:
  schematic:
    cue:
      template: |
        import "vela/kube"

        // schema declares the output contract consumed via fromSource.
        schema: {
          tenant:     string
          department: string
        }

        // Cache per namespace on the current cluster. context.namespace is the
        // Application's namespace; context.cluster scopes the entry per cluster.
        storage: {
          key:            "namespace-metadata-\(context.cluster)-\(context.namespace)"
          storageTTL:     "5m"
          onStaleFailure: "use-stale"
        }

        // This source takes no author-supplied properties; resolution is driven
        // entirely by context (the Application's namespace and cluster).
        parameter: {}

        // Read the Application's own namespace object and pull two labels off it.
        _ns: kube.#Get & {
          $params: {
            cluster: context.cluster
            resource: {
              apiVersion: "v1"
              kind:       "Namespace"
              metadata: {
                name: context.namespace
              }
            }
          }
        }

        // If a label is absent the reference is incomplete and resolution fails
        // (surfaced as Failed on the Application status). Required labels are
        // therefore enforced simply by consuming them in output.
        output: {
          tenant:     _ns.$returns.metadata.labels["tenant"]
          department: _ns.$returns.metadata.labels["department"]
        }
---
apiVersion: core.oam.dev/v1beta1
kind: SourceDefinition
metadata:
  name: cluster-info
  namespace: source-demo
spec:
  schematic:
    cue:
      template: |
        import "vela/kube"

        schema: {
          region:      string
          environment: string
        }

        // A single cluster-wide fact: one cache entry per cluster, shared across
        // every Application that reads it.
        storage: {
          key:            "cluster-info-\(context.cluster)"
          storageTTL:     "15m"
          onStaleFailure: "use-stale"
        }

        parameter: {}

        // Read the cluster-info ConfigMap from the default namespace.
        _cm: kube.#Get & {
          $params: {
            cluster: context.cluster
            resource: {
              apiVersion: "v1"
              kind:       "ConfigMap"
              metadata: {
                name:      "cluster-info"
                namespace: "default"
              }
            }
          }
        }

        output: {
          region:      _cm.$returns.data["region"]
          environment: _cm.$returns.data["environment"]
        }
---
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: resolved-metadata
  namespace: source-demo
spec:
  sources:
    - name: nsMeta
      type: namespace-metadata
    - name: clusterInfo
      type: cluster-info

  components:
    # A raw ConfigMap component (k8s-objects) whose data is populated from the
    # two resolved sources. Substitution happens before the component renders,
    # so the ConfigMap is written with concrete values.
    - name: resolved-config
      type: k8s-objects
      properties:
        objects:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: resolved-metadata
              namespace: source-demo
            data:
              tenant:
                fromSource: nsMeta.tenant
              department:
                fromSource: nsMeta.department
              region:
                fromSource: clusterInfo.region
              environment:
                fromSource: clusterInfo.environment
