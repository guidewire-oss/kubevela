apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: tenant-config
  namespace: source-demo
spec:
  sources:
    - name: tenant
      type: tenant-data
    - name: cluster
      type: cluster-lookup

  components:
    # Writes the resolved tenant and cluster data into a ConfigMap. Values are
    # substituted via fromSource before the component renders, so the ConfigMap
    # is created with concrete data.
    - name: tenant-config
      type: k8s-objects
      properties:
        objects:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: tenant-config
              namespace: source-demo
            data:
              tenantName:
                fromSource: tenant.name
              department:
                fromSource: tenant.department
              environment:
                fromSource: tenant.environment
              # costCenter is optional in the tenant-data schema, so it may be
              # absent at resolution time. The target here is a free-form
              # ConfigMap field (not a typed required parameter), so admission
              # does not force a default -- but supplying one via the map form is
              # good practice: without it, an absent costCenter would omit the
              # key entirely. (Admission only *requires* a default when an
              # optional source field feeds a required target parameter.)
              costCenter:
                fromSource:
                  name: tenant
                  path: costCenter
                  default: "unassigned"
              region:
                fromSource: cluster.region
              zone:
                fromSource: cluster.zone
              provider:
                fromSource: cluster.provider
