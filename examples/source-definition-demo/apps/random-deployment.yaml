apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: random-deployment
  namespace: source-demo
  annotations:
    # Opt in to re-dispatch when a consumed source re-resolves to a new value.
    # "true"/"*" = any source; or a comma list of source names, e.g. "random-deployment-replicas".
    # Without this, a healthy component keeps its last-applied resolved values.
    app.oam.dev/autoUpdateSources: "true"
spec:
  sources:
    - name: random-deployment-replicas
      type: get-random

    - name: cluster
      type: cluster-lookup

    - name: tenant
      type: tenant-data

    # Chained source: assembles the deployment name from the sources above plus
    # the component name. Its inputs are fed by expressions from earlier sources.
    - name: deployment-name
      type: deployment-namer
      properties:
        component: web
        region:
          '$(source.cluster.region)'
        zone:
          '$(source.cluster.zone)'
        department:
          '$(source.tenant.department)'
        tenant:
          '$(source.tenant.name)'

  components:
    - name: web
      type: demo-deployment
      properties:
        name:
          '$(source["deployment-name"].name)'
        replicas: 
          '$(source["random-deployment-replicas"].value)'
        region:
          '$(source.cluster.region)'
        zone:
          '$(source.cluster.zone)'
        department:
          '$(source.tenant.department)'
        tenant:
          '$(source.tenant.name)'
        environment:
          '$(source.tenant.environment)'
