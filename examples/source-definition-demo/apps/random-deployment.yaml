apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: random-deployment
  namespace: source-demo
spec:
  sources:
    # autoUpdate re-dispatches the components reading this binding when its
    # resolved value changes, without waiting for the workflow to run again.
    # Unset defers to the EnableSourceAutoUpdate feature gate; a publishVersion
    # pin suppresses it either way.
    - name: random-deployment-replicas
      type: get-random
      autoUpdate: true

    - name: cluster
      type: cluster-lookup
      autoUpdate: true

    - name: tenant
      type: tenant-data

    # Chained source: assembles the deployment name from the sources above plus
    # the component name. Its inputs are fed by expressions from earlier sources.
    - name: deployment-name
      type: deployment-namer
      properties:
        component: web
        region:
          '$(source.cluster.region)'
        zone:
          '$(source.cluster.zone)'
        department:
          '$(source.tenant.department)'
        tenant:
          '$(source.tenant.name)'

  components:
    - name: web
      type: demo-deployment
      properties:
        name:
          '$(source["deployment-name"].name)'
        replicas: 
          '$(source["random-deployment-replicas"].value)'
        region:
          '$(source.cluster.region)'
        zone:
          '$(source.cluster.zone)'
        department:
          '$(source.tenant.department)'
        tenant:
          '$(source.tenant.name)'
        environment:
          '$(source.tenant.environment)'
