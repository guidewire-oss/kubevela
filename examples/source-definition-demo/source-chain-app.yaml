apiVersion: core.oam.dev/v1beta1
kind: SourceDefinition
metadata:
  name: cluster-source
  namespace: default
  annotations:
    # Generated by inference from the context this template reads; see
    # configmap-check-source.yaml for what the two annotations mean.
    definition.oam.dev/cache-key-rules: "6ac674fa"
    definition.oam.dev/cache-key-rules-version: v1
spec:
  schematic:
    cue:
      template: |
        output: {
          nested: {
            image: {
              repo: parameter.repo
              tag:  parameter.tag
            }
            meta: {
              region: parameter.region
            }
          }
        }
        parameter: {
          repo:   string
          tag:    string
          region: string
        }
        // Generated, not authored: this template reads no context, so the
        // source is unkeyed and its entries are separated by properties alone.
        $internal: {
          key: "cluster-source"
          keyInputs: []
        }
---
apiVersion: core.oam.dev/v1beta1
kind: SourceDefinition
metadata:
  name: render-source
  namespace: default
  annotations:
    # Generated by inference from the context this template reads; see
    # configmap-check-source.yaml for what the two annotations mean.
    definition.oam.dev/cache-key-rules: "6ac674fa"
    definition.oam.dev/cache-key-rules-version: v1
spec:
  schematic:
    cue:
      template: |
        output: {
          resolved: {
            image: "\(parameter.repo):\(parameter.tag)"
            region: parameter.region
          }
        }
        parameter: {
          repo:   string
          tag:    string
          region: string
        }
        // Generated, not authored: this template reads no context, so the
        // source is unkeyed and its entries are separated by properties alone.
        $internal: {
          key: "render-source"
          keyInputs: []
        }
---
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: source-chain-app
  namespace: default
spec:
  sources:
    - name: clusterInfo
      type: cluster-source
      properties:
        repo: nginx
        tag: "1.25.2"
        region: us-east-1
      statusPolicy:
        exposeConsumedValues: true
        maskPaths:
          - nested.image.tag
    - name: rendered
      type: render-source
      properties:
        repo:
          '$(source.clusterInfo.nested.image.repo)'
        tag:
          '$(source.clusterInfo.nested.image.tag)'
        region:
          '$(source.clusterInfo.nested.meta.region)'
  components:
    - name: web-chain
      type: webservice
      properties:
        image:
          '$(source.rendered.resolved.image)'
        port: 80
      traits:
        - type: scaler
          properties:
            replicas: 3
