# Prerequisites for read-cluster-config-app.yaml.
#
# Apply this BEFORE the app so the two SourceDefinitions have real cluster state
# to read:
#   - a dedicated `source-demo` namespace carries the tenant/department labels
#     (the app runs here, so namespace-metadata reads these labels off it)
#   - a `cluster-info` ConfigMap exists in the `default` namespace
#
# A dedicated namespace is used rather than labelling `default` so the demo is
# self-contained and non-invasive.
---
apiVersion: v1
kind: Namespace
metadata:
  name: source-demo
  labels:
    tenant: acme
    department: platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-info
  namespace: default
data:
  region: us-east-1
  environment: production
